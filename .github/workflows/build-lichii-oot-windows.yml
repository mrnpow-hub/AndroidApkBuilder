name: Build OOT Fritchii v4.1 Windows EXE

on:
  push:
    branches:
      - experiments/lichii-oot-stutter-build-20261108
    paths:
      - .github/workflows/build-lichii-oot-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile OOT-enhanced Fritchii Windows
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out pinned Fritchii source
        uses: actions/checkout@v4
        with:
          repository: Frizti/Fritchii
          ref: f6d42b87150678e001dbeb84679a9595935ce951
          path: emulator
          submodules: recursive
          persist-credentials: false
      - name: Check out Lichii OOT PGO profile
        uses: actions/checkout@v4
        with:
          repository: zortos293/Lichii
          ref: 89440b29a90708c0fefc126b2bd8c7a64a996bdd
          path: lichii117
          sparse-checkout: |
            lichii-windows.profdata
          persist-credentials: false
      - name: Apply RTX 2070 Super retention patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'emulator/src/video_core/renderer_vulkan/vk_pipeline_cache.cpp'
          $data = [IO.File]::ReadAllText($file)
          $old = ': size_t{8000};'
          if ($data.IndexOf($old) -lt 0 -or $data.IndexOf($old) -ne $data.LastIndexOf($old)) {
            throw 'Pinned pipeline retention anchor missing or duplicated'
          }
          [IO.File]::WriteAllText($file, $data.Replace($old, ': size_t{6000};'), [Text.UTF8Encoding]::new($false))
          Copy-Item lichii117/lichii-windows.profdata emulator/lichii-windows.profdata
          if ((Get-Item emulator/lichii-windows.profdata).Length -lt 100000) {
            throw 'The OOT profile is absent'
          }
          git -C emulator diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch diff check failed' }
      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned LLVM clang-cl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '22.1.8'
          $hash = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          $installer = Join-Path $env:RUNNER_TEMP 'llvm.exe'
          Invoke-WebRequest -OutFile $installer "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw 'LLVM checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'llvm'
          Start-Process -Wait -FilePath $installer -ArgumentList '/S', "/D=$root"
          & "$root/bin/clang-cl.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Clang failed to launch' }
          "LLVM_ROOT=$($root.Replace('\', '/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: emulator
        run: ./tools/windows/install-vulkan-sdk.ps1
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: emulator/.cache/cpm
          key: experimental-oot-fritchii-cpm-v1
      - name: Configure emulator with Windows OOT PGO
        shell: bash
        working-directory: emulator
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          flags+=" -fprofile-use=$(cygpath -m "$PWD/lichii-windows.profdata")"
          flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
          flags+=" -Wno-error=backend-plugin"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DLICHII_BUILD_TAG=oot-fritchii-2070s-v1 \
            -DLICHII_BUILD_PLATFORM=windows-x86_64-pgo \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"
      - name: Compile Lichii executable
        shell: bash
        working-directory: emulator
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 3
      - name: Bundle Windows DLLs
        shell: pwsh
        working-directory: emulator
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path build/release/bin/lichii.exe)) { throw 'Windows emulator EXE missing' }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          @'
          OOT Fritchii v4.1, RTX 2070 Super experimental build.
          Fork includes host frame pacing, DMA snapshots, and shader caching.
          The pipeline retention default is adapted from 8000 to 6000.
          Uses Lichii 117 OOT PGO data. Gameplay performance is unverified.
          Close all emulators and back up your %APPDATA%\eden folder.
          Extract the entire ZIP to a new directory. Launch lichii.exe.
          No game files, saves, keys, or firmware are distributed.
          '@ | Set-Content -Encoding utf8 build/release/bin/README-OOT-EXPERIMENT.txt
      - name: Upload EXE and runtime files
        uses: actions/upload-artifact@v4
        with:
          name: Fritchii-OOT-2070S-Windows-EXE
          path: emulator/build/release/bin/
          if-no-files-found: error
          retention-days: 7
