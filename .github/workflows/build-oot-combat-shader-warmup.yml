name: Build OOT Shader Warmup Experimental Windows
on:
  push:
    branches:
      - experiments/lichii-oot-combat-warmup-20261108
    paths:
      - .github/workflows/build-oot-combat-shader-warmup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out pinned shader warm-up pull request 579
        uses: actions/checkout@v4
        with:
          repository: PantACRO4life/Lichii
          ref: 408ae11a49da6292d9409b6507c8f583541bff67
          path: emulator
          submodules: recursive
          persist-credentials: false

      - name: Verify exact source and warm-up support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git -C emulator rev-parse HEAD).Trim()
          if ($sha -ne '408ae11a49da6292d9409b6507c8f583541bff67') {
            throw "Wrong source revision: $sha"
          }
          if (!(Test-Path emulator/lichii-windows.profdata)) { throw 'OOT PGO profile missing' }
          if ((Get-Item emulator/lichii-windows.profdata).Length -lt 100000) {
            throw 'OOT PGO profile unexpectedly small'
          }
          if (!(Test-Path emulator/src/video_core/shader_warm/shader_warm_builder.cpp)) {
            throw 'PR 579 shader warm-up implementation not present'
          }
          Write-Host "Pinned warm-up source validated: $sha"

      - name: Set up MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install pinned LLVM clang-cl 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '22.1.8'
          $hash = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          $installer = Join-Path $env:RUNNER_TEMP 'llvm.exe'
          Invoke-WebRequest -OutFile $installer "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw 'LLVM checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'llvm'
          Start-Process -Wait -FilePath $installer -ArgumentList '/S', "/D=$root"
          & "$root/bin/clang-cl.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Clang failed to launch' }
          "LLVM_ROOT=$($root.Replace('\', '/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: emulator
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: emulator/.cache/cpm
          key: oot-pr579-windows-cpm-v1
          restore-keys: |
            experimental-oot-fritchii-cpm-v1

      - name: Configure shader warm-up Windows PGO
        shell: bash
        working-directory: emulator
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          flags+=" -fprofile-use=$(cygpath -m "$PWD/lichii-windows.profdata")"
          flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
          flags+=" -Wno-error=backend-plugin"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DLICHII_BUILD_TAG=oot-shader-warmup-pr579 \
            -DLICHII_BUILD_PLATFORM=windows-x86_64-pgo \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Compile Windows EXE
        shell: bash
        working-directory: emulator
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel 3

      - name: Package Windows executable and runtime DLLs
        shell: pwsh
        working-directory: emulator
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path build/release/bin/lichii.exe)) { throw 'lichii.exe missing' }
          if (!(Test-Path build/release/bin/eden-cli.exe)) { throw 'eden-cli.exe missing' }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          @'
          EXPERIMENTAL OOT SHADER WARM-UP BUILD (NOT THE FRITCHII RETENTION BUILD)
          Source: Lichii PR 579 / PantACRO4life/Lichii at 408ae11a49da6292d9409b6507c8f583541bff67.
          Windows x64, clang-cl 22.1.8, ThinLTO, Ocarina-trained PGO.

          EXTRACT the entire artifact ZIP into a separate folder. Run lichii.exe.
          Back up %APPDATA%\eden first. Saves/settings can be shared across forks.
          This build does not include PR 313's pipeline retention or Fritchii's frame pacer.

          In the game list, right-click your own game -> Prepare shaders (warm-up).
          In Graphics -> Advanced, enable Shader libraries.
          Keep native Switch 2 draws = Wait initially; Skip/Bounded risks missing effects.
          Complete the warm-up, then restart the emulator and test the same fights.
          Warm-up on a fresh driver cache can be lengthy and consumes CPU/disk space.
          No game data, firmware, keys, caches or shaders are distributed.

          KNOWN PR 579 LIMITATIONS: occasional white areas reported during some
          first-time pipeline builds; possible rebuilds after changing emulator/driver.
          Stop using this test build if you notice corruption or instability.
          '@ | Set-Content -Encoding utf8 build/release/bin/README-COMBAT-SHADER-WARMUP.txt

      - name: Upload complete test build
        uses: actions/upload-artifact@v4
        with:
          name: OOT-Combat-Shader-Warmup-PR579-Windows
          path: emulator/build/release/bin/
          if-no-files-found: error
          retention-days: 7
